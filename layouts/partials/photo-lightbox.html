{{ if .IsPage }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/css/glightbox.min.css">
<script src="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/js/glightbox.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var imgs = Array.from(document.querySelectorAll('main img')).filter(function (img) {
    return !img.src.includes('avatars.micro.blog');
  });

  if (!imgs.length) return;

  imgs.forEach(function (img) {
    var a = document.createElement('a');
    a.href = img.src;
    a.className = 'glightbox';
    a.dataset.gallery = 'post-gallery';
    if (img.alt) a.dataset.description = img.alt;
    img.parentNode.insertBefore(a, img);
    a.appendChild(img);
  });

  GLightbox({ selector: '.glightbox', touchNavigation: true });
});
</script>
{{ end }}
